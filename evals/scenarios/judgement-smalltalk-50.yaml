  - { at: +4min, say: "need coffee asap" }
  - { at: +6min, say: "ok coffee acquired" }
  - { at: +8min, say: "it's so grey outside today" }
  - { at: +10min, say: "traffic is insane right now" }
  - { at: +12min, say: "finally at my desk" }
  - { at: +14min, say: "so many emails lol" }
  - { at: +16min, say: "brb" }
  - { at: +18min, say: "btw my brother Daniyar is a pilot" }
  - { at: +20min, say: "haha anyway" }
  - { at: +22min, say: "what a morning" }
  - { at: +24min, say: "I'm starving already" }
  - { at: +26min, say: "just had a croissant" }
