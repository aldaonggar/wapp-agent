  - { at: +88min, say: "home finally" }
  - { at: +90min, say: "so tired" }
  - { at: +92min, say: "making pasta" }
  - { at: +94min, say: "pasta was great" }
  - { at: +96min, say: "netflix time" }
  - { at: +98min, say: "night!" }
