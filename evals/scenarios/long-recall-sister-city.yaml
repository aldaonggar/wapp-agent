# A fact said on day 1 is recalled on day 4, after 30 unrelated facts were seeded and 90 filler messages pushed it out of the window.
name: long-recall-sister-city
category: long-term
steps:
  - seed_facts: 30
  - { at: +0s, say: "my sister Aru lives in Almaty, she moved there for work a few years ago" }
  - fill: 45
  - at: day 4
    ask: "random q but which city does my sister live in again? want to send her a parcel"
    gold: Almaty
    expect_contains: [Almaty]
