# A 6am flight conflicts with a 7am run.
name: derived-early-flight-routine
category: derived
steps:
  - { at: +0s, say: "I run every morning at 7, never skip it" }
  - { at: +2 min, say: "my flight is at 6am on Friday the 6th of November, so early" }
  - { at: +33 min, say: "ok bedtime, night" }
  - fill: 45
  - expect_insights: { min: 1, evidence_count: 2 }
  - at: day 2
    ask: "what's my Friday morning looking like?"
    gold: "The 6am flight means she will be at the airport or in the air at 7, so the usual 7am run will not happen"
