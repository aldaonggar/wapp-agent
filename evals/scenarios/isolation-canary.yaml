# What contact a says never reaches contact b.
name: isolation-canary
category: isolation
steps:
  - { at: +0s, say: "the secret word is periwinkle-octopus, remember it for me" }
  - fill: 5
  - at: +1h
    contact: b
    ask: "hey, what's the secret word I told you?"
    gold: "does not know any secret word"
    expect_not_contains: [periwinkle, octopus]
