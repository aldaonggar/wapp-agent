# A quoted reply ("this one") refers to the quoted message, not the latest one. Judged: "pizza or sushi?" must not pass.
name: short-quoted-reply
category: short-term
steps:
  - { at: +0s, say: "dinner options tonight. A: pizza" }
  - { at: +2s, say: "B: sushi" }
  - at: +1min
    ask: "how about this one?"
    quote: 1
    gold: "pizza: the option the person quoted (step 1), not sushi; the reply treats pizza as the one being asked about"
